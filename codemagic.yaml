workflows:
  ios-xcodegen-build:
    name: Build LSSign
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: app.lemon2974.peach9464
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen

      - name: Generate Xcode project
        script: xcodegen generate

      - name: Initialize keychain
        script: keychain initialize

      - name: Install provisioning profile manually
        script: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          find /Users/builder -name "*.mobileprovision" 2>/dev/null
          cp /Users/builder/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision \
             ~/Library/MobileDevice/Provisioning\ Profiles/ 2>/dev/null || echo "No source profile found"
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Set up code signing settings
        script: |
          xcode-project use-profiles \
            --project "LSSign.xcodeproj" \
            --export-options-plist=/Users/builder/export_options.plist

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "LSSign.xcodeproj" \
            --scheme "LSSign" \
            --export-options-plist=/Users/builder/export_options.plist \
            --verbose

    artifacts:
      - build/ios/ipa/*.ipa