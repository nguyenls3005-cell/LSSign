workflows:
  ios-xcodegen-build:
    name: Build LSSign
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - manual_code_signing
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen

      - name: Generate Xcode project
        script: xcodegen generate

      - name: Initialize keychain
        script: keychain initialize

      - name: Set up provisioning profile
        script: |
          PROFILES_HOME="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_HOME"
          PROFILE_PATH="$(mktemp "$PROFILES_HOME"/$(uuidgen).mobileprovision)"
          echo ${CM_PROVISIONING_PROFILE} | base64 --decode > "$PROFILE_PATH"
          echo "Saved provisioning profile $PROFILE_PATH"
          mkdir -p ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/

      - name: Add signing certificate
        script: |
          echo $CM_CERTIFICATE | base64 --decode > /tmp/certificate.p12
          keychain add-certificates --certificate /tmp/certificate.p12 --certificate-password $CM_CERTIFICATE_PASSWORD

      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles \
            --export-options-plist /Users/builder/export_options.plist

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "LSSign.xcodeproj" \
            --scheme "LSSign" \
            --archive-flags "-destination 'generic/platform=iOS'" \
            --archive-xcargs "CODE_SIGNING_REQUIRED=YES CODE_SIGNING_ALLOWED=NO" \
            --export-options-plist /Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa