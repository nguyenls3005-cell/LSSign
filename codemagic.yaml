workflows:
  ios-xtool-build:
    name: Build LSSign
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: app.lemon2974.peach9464
    scripts:
      - name: Initialize keychain
        script: keychain initialize
      - name: Fetch signing files
        script: xcode-project use-profiles
      - name: Install xtool
        script: |
          curl -fsSL https://xtool.sh/install.sh | sh
          export PATH="$HOME/.xtool/bin:$PATH"
      - name: Build IPA
        script: xtool dev build --ipa
    artifacts:
      - build/ios/ipa/*.ipa