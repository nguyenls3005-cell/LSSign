workflows:
  ios-xcodegen-build:
    name: Build LSSign
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: app.lemon2974.peach9464
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen

      - name: Generate Xcode project
        script: xcodegen generate

      - name: Initialize keychain
        script: keychain initialize

      - name: Set up code signing settings
        script: |
          xcode-project use-profiles \
            --project "LSSign.xcodeproj" \
            --export-options-plist=/Users/builder/export_options.plist

      - name: Verify export options
        script: |
          echo "=== Export options content ==="
          cat /Users/builder/export_options.plist || echo "File not found"

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "LSSign.xcodeproj" \
            --scheme "LSSign" \
            --export-options-plist=/Users/builder/export_options.plist \
            --verbose

    artifacts:
      - build/ios/ipa/*.ipa