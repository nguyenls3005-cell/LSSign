workflows:
  ios-xcodegen-build:
    name: Build LSSign
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: app.lemon2974.peach9464
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen

      - name: Generate Xcode project
        script: xcodegen generate

      - name: Initialize keychain
        script: keychain initialize

      - name: Set up code signing settings
        script: |
          xcode-project use-profiles --project "LSSign.xcodeproj"

      - name: Verify export options file
        script: |
          echo "=== Checking for export_options.plist ==="
          find /Users/builder -name "export_options.plist" 2>/dev/null || echo "Not found in /Users/builder"
          ls -la /Users/builder/Library/MobileDevice/Provisioning\ Profiles/ 2>/dev/null || echo "No profiles dir"

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "LSSign.xcodeproj" \
            --scheme "LSSign" \
            --verbose

    artifacts:
      - build/ios/ipa/*.ipa